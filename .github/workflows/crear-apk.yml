name: Crear APK CORREGIDO

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  crear-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restaurar firma permanente desde GitHub Secrets
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo 'ERROR: Falta ANDROID_DEBUG_KEYSTORE_BASE64 en los secretos de GitHub.' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/ganageo-firma"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ganageo-firma/debug.keystore"
          test -s "$RUNNER_TEMP/ganageo-firma/debug.keystore"
          keytool -list -v \
            -keystore "$RUNNER_TEMP/ganageo-firma/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep 'SHA1:'
          echo 'Firma permanente recuperada y validada.'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Por defecto esta accion instala "tools platform-tools", pero Google
          # retiro el paquete obsoleto "tools" del repositorio del SDK y
          # sdkmanager termina con codigo 1. Se deja vacio: el paso siguiente
          # instala explicitamente lo que el proyecto necesita.
          packages: ""

      - name: Instalar Android 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Buscar o extraer proyecto Android
        id: proyecto
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name settings.gradle.kts \
            -not -path '*/.git/*' \
            -printf '%h\n' | head -n 1 || true)"

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -iname '*.zip' | head -n 1 || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "No se encontró un proyecto Android ni un archivo ZIP." >&2
              exit 1
            fi

            rm -rf "$RUNNER_TEMP/ganageo-project"
            mkdir -p "$RUNNER_TEMP/ganageo-project"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/ganageo-project"

            PROJECT_DIR="$(find "$RUNNER_TEMP/ganageo-project" \
              -type f \
              -name settings.gradle.kts \
              -printf '%h\n' | head -n 1 || true)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró settings.gradle.kts después de extraer el ZIP." >&2
            exit 1
          fi

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar proyecto
        shell: bash
        working-directory: ${{ steps.proyecto.outputs.dir }}
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "Proyecto Android verificado."

      - name: Compilar APK Debug
        shell: bash
        working-directory: ${{ steps.proyecto.outputs.dir }}
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ANDROID_DEBUG_KEYSTORE: ${{ runner.temp }}/ganageo-firma/debug.keystore
          ANDROID_DEBUG_STORE_PASSWORD: android
          ANDROID_DEBUG_KEY_ALIAS: androiddebugkey
          ANDROID_DEBUG_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Recoger APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR='${{ steps.proyecto.outputs.dir }}'

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' | head -n 1)"

          test -n "$APK_FILE"

          # El nombre sale del versionName real, para no confundir dos APK
          # distintos al instalarlos en el telefono.
          VERSION="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' \
            "$PROJECT_DIR/app/build.gradle.kts" | head -n 1)"
          if [ -z "$VERSION" ]; then
            VERSION="debug"
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-salida"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-salida/Gana-Geo-$VERSION-debug.apk"

          echo "Version compilada: $VERSION"
          echo "path=$GITHUB_WORKSPACE/apk-salida/Gana-Geo-$VERSION-debug.apk" \
            >> "$GITHUB_OUTPUT"

      - name: Verificar que la firma del APK sea la permanente
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          EXPECTED="$(keytool -list -v -keystore "$RUNNER_TEMP/ganageo-firma/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA1: //p' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          ACTUAL="$("$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}" | sed -n 's/.*SHA-1 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          echo "SHA-1 de la firma: $EXPECTED"
          echo "SHA-1 del APK:   $ACTUAL"
          test -n "$EXPECTED"
          test -n "$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo 'ERROR: El APK no utiliza la firma permanente.' >&2
            exit 1
          fi
      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Gana-Geo-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Eliminar archivo de firma temporal del runner
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/ganageo-firma/debug.keystore"
